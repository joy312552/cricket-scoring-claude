<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a8f6a">
<title>Live cricket score | CREASE</title><meta name="description" content="Live cricket score, scorecard and commentary.">
<link rel="stylesheet" href="/css/site.css">
<style>
:root{--g:#0a8f6a;--g2:#066b50;--ink:#222;--mut:#6b7280;--ln:#e3e6e8;--bg:#e9ecef;--red:#d32f2f}
html,body{background:var(--bg)!important;color:var(--ink)!important;font:15px/1.45 "Helvetica Neue",Arial,"Noto Sans Bengali",sans-serif!important}
a{color:inherit}.w{max-width:980px;margin:0 auto}
.top{background:linear-gradient(180deg,var(--g),var(--g2));color:#fff}.top .w{display:flex;align-items:center;gap:14px;height:54px;padding:0 14px}
.brand{font:900 24px/1 Arial,sans-serif;letter-spacing:.06em}.brand i{font-style:normal;color:#d3ff3a}.top .sp{flex:1}.top button{background:#ffffff1f;border:0;color:#fff;padding:8px 12px;font:600 13px Arial;cursor:pointer}.top button:hover{background:#ffffff38}
.crumb{padding:10px 14px;font-size:12px;color:var(--mut)}
.card{background:#fff;border:1px solid var(--ln);margin:0 0 12px}
.hd{padding:14px 16px 6px}.hd .t{font:700 20px/1.25 Arial,sans-serif;color:#111}.hd .s{font-size:12px;color:var(--mut);margin-top:3px}
.sc{padding:6px 16px 4px}.sc .r{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #f0f1f2}.sc .r:last-child{border:0}
.fl{width:34px;height:34px;flex:none;display:grid;place-items:center;font:800 12px Arial;border-radius:50%;overflow:hidden;color:#fff}.fl img{width:100%;height:100%;object-fit:cover}
.sc .n{font:700 17px Arial;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sc .n.dim{color:var(--mut);font-weight:600}.sc .v{font:700 20px Arial;font-variant-numeric:tabular-nums;text-align:right}.sc .v small{font:400 13px Arial;color:var(--mut);margin-left:4px}
.st{padding:10px 16px 14px;font:700 15px Arial;color:var(--g2)}.st.live{color:var(--red)}.st .dot{display:inline-block;width:8px;height:8px;background:var(--red);border-radius:50%;margin-right:8px;animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.25}}
.tabs{display:flex;background:#fff;border:1px solid var(--ln);border-bottom:0;overflow-x:auto;position:sticky;top:0;z-index:5}.tabs button{background:none;border:0;padding:13px 18px;font:700 14px Arial;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}.tabs button.on{color:var(--g);border-bottom-color:var(--g)}
.pn{background:#fff;border:1px solid var(--ln);padding:0;margin-bottom:12px}.pn .h{background:#f3f5f6;padding:9px 14px;font:700 13px Arial;color:#333;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;gap:10px}.pn .h b{font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}th{font:700 11px Arial;color:var(--mut);text-align:right;padding:8px 10px;border-bottom:1px solid var(--ln);text-transform:uppercase}th:first-child,td:first-child{text-align:left}td{padding:9px 10px;border-bottom:1px solid #f0f1f2;text-align:right;font-variant-numeric:tabular-nums}tr:last-child td{border:0}td b{font-weight:700}td small{display:block;color:var(--mut);font-size:12px;font-weight:400}td.nm{font-weight:700;color:#0b57a4}td.nm.out{color:#222}
.kv{display:grid;grid-template-columns:140px 1fr;gap:0}.kv>div{padding:10px 14px;border-bottom:1px solid #f0f1f2}.kv>div:nth-child(odd){color:var(--mut);font-weight:600;background:#fafbfb}
.row2{padding:10px 14px;display:flex;gap:22px;flex-wrap:wrap;font-size:14px;border-bottom:1px solid #f0f1f2}.row2 span b{margin-left:4px}
.balls{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px}.bl{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 5px;border-radius:50%;background:#eef0f1;font:700 12px Arial}.bl.f{background:#1e88e5;color:#fff}.bl.s{background:#7b1fa2;color:#fff}.bl.w{background:var(--red);color:#fff}.bl.x{background:#ef6c00;color:#fff}
.cm{display:grid;grid-template-columns:54px 40px 1fr;gap:10px;padding:11px 14px;border-bottom:1px solid #f0f1f2;align-items:start}.cm .o{font:700 13px Arial;color:var(--mut)}.cm .bl{width:30px;height:30px;font-size:12px}.cm .tx{font-size:14px}.cm .tx b{font-weight:700}.cm.w{background:#fff5f5}.cm.f4{background:#f4f9ff}.cm.f6{background:#faf4fc}
.sq{display:grid;grid-template-columns:1fr 1fr}.sq>div{padding:0}.sq .p{padding:10px 14px;border-bottom:1px solid #f0f1f2;display:flex;justify-content:space-between;gap:8px}.sq .p small{color:var(--mut)}@media(max-width:600px){.sq{grid-template-columns:1fr}.kv{grid-template-columns:110px 1fr}}
.empty{padding:26px 16px;color:var(--mut);text-align:center}
.sk{background:linear-gradient(90deg,#eceff1,#f7f8f9,#eceff1);background-size:200% 100%;animation:shm 1.2s infinite;height:18px;margin:12px 16px}@keyframes shm{to{background-position:-200% 0}}
#qrp{padding:14px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.foot{padding:18px 14px 40px;text-align:center;color:var(--mut);font-size:12px}.foot b{color:var(--g)}
@media print{.top,.tabs,#qrp,.foot,.crumb{display:none!important}body,html{background:#fff!important}.card,.pn{border:1px solid #999}}
</style></head><body>
<div class="top"><div class="w"><a class="brand" href="/">CREASE<i>.</i></a><span class="sp"></span><button id="qrb">QR</button><button id="simg">Save image</button><button id="prn">Print</button><button id="share">Share</button></div></div>
<div class="w"><div id="qrp" class="card" hidden><div id="qrimg" style="width:150px;height:150px;background:#fff"></div><div><b>Scan to follow live</b><div id="qrurl" style="color:var(--mut);font-size:12px;word-break:break-all"></div></div></div>
<div id="root"><div class="card" style="margin-top:12px"><div class="sk" style="width:60%;height:24px"></div><div class="sk"></div><div class="sk" style="width:80%"></div><div class="sk" style="height:40px"></div></div><div class="card"><div class="sk"></div><div class="sk"></div><div class="sk" style="width:70%"></div></div></div>
<div class="foot">Live scoring and TV-style overlays by <b>CREASE</b></div></div>
<script type="module">
import { esc } from '/js/core.js'; import { qrSvg } from '/js/qr.js'; import { subscribe } from '/js/rt.js'; import { openSummary } from '/js/summary-ui.js';
const qs = new URLSearchParams(location.search), id = qs.get('id') || location.pathname.split('/').filter(Boolean)[1], PUB = `${location.origin}/m/?id=${id}`;
let tab = qs.get('print') ? 'card' : 'live', vm = null, ver = '', open = {};
const cls = (s) => (s === 'W' ? 'w' : s === '4' ? 'f' : s === '6' ? 's' : /^(Wd|Nb)/.test(s) ? 'x' : '');
const ball = (s) => `<span class="bl ${cls(s)}">${esc(s)}</span>`;
const fl = (t) => `<span class="fl" style="background:${esc(t.color)};color:${esc(t.color2)}">${t.logo ? `<img src="${esc(t.logo)}" alt="">` : esc((t.short || '').slice(0, 3))}</span>`;
const KIND = { bowled: 'bowled', caught: 'caught', caughtAndBowled: 'caught and bowled', lbw: 'lbw', runOut: 'run out', stumped: 'stumped', hitWicket: 'hit wicket', obstructing: 'obstructing the field', hitBallTwice: 'hit the ball twice', retiredOut: 'retired out', timedOut: 'timed out' };
function text(b) {
  const w = `${esc(b.bw)} to ${esc(b.st)}`, s = b.sym;
  if (b.w) return `<b>OUT!</b> ${esc(b.ob || b.st)} ${KIND[b.dk] || 'is out'}.`;
  if (s === '4') return `${w}, <b>FOUR</b>`; if (s === '6') return `${w}, <b>SIX</b>`; if (s === '0') return `${w}, no run`; if (/^\d$/.test(s)) return `${w}, ${s} run${s === '1' ? '' : 's'}`;
  if (/^Wd/.test(s)) return `${w}, <b>wide</b>${s.length > 2 ? ' (' + s.slice(2) + ')' : ''}`; if (/^Nb/.test(s)) return `${w}, <b>no ball</b>${s.length > 2 ? ' (' + s.slice(2) + ')' : ''}`; if (/^B/.test(s)) return `${w}, bye${s.length > 1 ? 's' : ''}`; if (/^Lb/.test(s)) return `${w}, leg bye${s.length > 2 ? 's' : ''}`; return `${w}, ${esc(s)}`;
}
function statusText(v) {
  if (v.result) return [v.result.text, false]; const s = v.score;
  if (!s) return [v.match.toss || 'Match starts soon', false];
  if (v.match.status === 'break') return ['Innings break', false];
  if (s.target != null) return [`${v.teams[v.bat].name} need ${s.need} run${s.need === 1 ? '' : 's'} in ${s.ballsLeft} ball${s.ballsLeft === 1 ? '' : 's'}`, true];
  return [`${v.teams[v.bat].name} batting${v.match.toss ? ' | ' + v.match.toss : ''}`, true];
}
const batTbl = (c) => `<table><thead><tr><th>Batter</th><th></th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr></thead><tbody>${c.bat.map(b => `<tr><td class="nm ${b.isOut ? 'out' : ''}">${esc(b.name)}${b.strike ? ' *' : ''}</td><td style="text-align:left;color:var(--mut);font-size:12px">${esc(b.out)}</td><td><b>${b.runs}</b></td><td>${b.balls}</td><td>${b.fours}</td><td>${b.sixes}</td><td>${b.sr}</td></tr>`).join('')}<tr><td>Extras</td><td colspan="6" style="text-align:left;color:var(--mut)">${esc(c.extras.text)}</td></tr><tr><td><b>Total</b></td><td colspan="6" style="text-align:left"><b>${c.runs}-${c.wkts}</b> (${c.overs} Ov)</td></tr></tbody></table>${c.yetToBat.length ? `<div class="row2"><span style="color:var(--mut)">Yet to bat:</span> ${esc(c.yetToBat.join(', '))}</div>` : ''}`;
const bowlTbl = (c) => `<table><thead><tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>NB</th><th>WD</th><th>ECO</th></tr></thead><tbody>${c.bowl.map(b => `<tr><td class="nm out">${esc(b.name)}</td><td>${b.o}</td><td>${b.m}</td><td>${b.r}</td><td><b>${b.w}</b></td><td>${b.nb}</td><td>${b.wd}</td><td>${b.econ}</td></tr>`).join('')}</tbody></table>`;
const fowTbl = (c) => c.fow.length ? `<div class="row2" style="display:block"><b>Fall of wickets:</b> ${c.fow.map(f => `${f.w}-${f.runs} (${esc(f.name)}, ${esc(f.at)} ov)`).join(', ')}</div>` : '';
function view() {
  const v = vm, s = v.score, cards = v.cards, cur = v.innings - 1;
  if (tab === 'live') {
    if (!s) return `<div class="pn"><div class="empty">The match has not started yet.</div></div>`;
    const c = v.card, last = c.fow[c.fow.length - 1], comm = (c.comm || []).slice().reverse().slice(0, 8);
    return `<div class="pn"><div class="row2"><span>CRR<b>${s.crr}</b></span>${s.target != null ? `<span>Target<b>${s.target}</b></span><span>RRR<b>${s.rrr ?? '-'}</b></span>` : s.proj ? `<span>Projected<b>${s.proj[0].score}</b></span>` : ''}<span>Overs<b>${s.overs}/${s.oversLimit}</b></span></div>
      <table><thead><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr></thead><tbody>${v.batters.map(b => `<tr><td class="nm">${esc(b.name)}${b.strike ? ' *' : ''}</td><td><b>${b.runs}</b></td><td>${b.balls}</td><td>${b.fours}</td><td>${b.sixes}</td><td>${b.sr}</td></tr>`).join('') || '<tr><td colspan="6" style="text-align:left">-</td></tr>'}</tbody></table>
      <table><thead><tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>ECO</th></tr></thead><tbody>${v.bowler ? `<tr><td class="nm out">${esc(v.bowler.name)}</td><td>${v.bowler.o}</td><td>${v.bowler.m}</td><td>${v.bowler.r}</td><td><b>${v.bowler.w}</b></td><td>${v.bowler.econ}</td></tr>` : '<tr><td colspan="6" style="text-align:left">-</td></tr>'}</tbody></table>
      <div class="row2"><span>Partnership<b>${v.partnership.runs} (${v.partnership.balls})</b></span>${last ? `<span>Last wkt<b>${esc(last.name)} ${last.runs} (${esc(last.at)} ov)</b></span>` : ''}</div>
      <div class="h" style="border-top:1px solid var(--ln)"><b>Recent</b></div><div class="balls">${(v.lastSix.length ? v.lastSix : ['-']).map(ball).join('')}</div></div>
      <div class="pn"><div class="h"><b>Commentary</b><a href="#" data-go="comm" style="color:var(--g)">See all</a></div>${comm.map(cm).join('') || '<div class="empty">No deliveries yet</div>'}</div>`;
  }
  if (tab === 'card') return cards.map((c, i) => `<div class="pn"><div class="h" data-tg="${i}" style="cursor:pointer"><b>${esc(c.teamName)}</b><b>${c.runs}-${c.wkts} (${c.overs} Ov)</b></div><div ${open[i] === false ? 'hidden' : ''}>${batTbl(c)}${fowTbl(c)}${bowlTbl(c)}</div></div>`).join('') || '<div class="pn"><div class="empty">No scorecard yet.</div></div>';
  if (tab === 'comm') { const all = cards.map((c, i) => ({ c, i })).reverse(); const out = all.map(({ c }) => `<div class="pn"><div class="h"><b>${esc(c.teamName)}</b><b>${c.runs}-${c.wkts}</b></div>${(c.comm || []).slice().reverse().map(cm).join('') || '<div class="empty">No deliveries yet</div>'}</div>`).join(''); return out || '<div class="pn"><div class="empty">No commentary yet.</div></div>'; }
  if (tab === 'squad') return `<div class="pn"><div class="sq">${['A', 'B'].map(sd => `<div><div class="h"><b>${esc(v.teams[sd].name)}</b></div>${v.xi[sd].map(p => `<div class="p"><span>${esc(p.name)}${p.cap ? ' (c)' : ''}${p.wk ? ' (wk)' : ''}</span><small>${esc(p.role)}</small></div>`).join('') || '<div class="empty">Not announced</div>'}</div>`).join('')}</div></div>`;
  if (tab === 'points') return `<div class="pn"><div class="h"><b>${esc(v.match.tournament)}: points table</b></div><table><thead><tr><th>Team</th><th>P</th><th>W</th><th>L</th><th>NRR</th><th>Pts</th></tr></thead><tbody>${(v.points || []).map(r => `<tr><td class="nm out">${esc(r.team)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.l}</td><td>${r.nrr > 0 ? '+' : ''}${r.nrr.toFixed(3)}</td><td><b>${r.pts}</b></td></tr>`).join('')}</tbody></table></div>`;
  return `<div class="pn"><div class="kv"><div>Match</div><div>${esc(v.match.name)}</div><div>Series</div><div>${esc(v.match.tournament || '-')}</div><div>Venue</div><div>${esc(v.match.venue || '-')}</div><div>Date</div><div>${esc((v.match.date || '').replace('T', ' '))}</div><div>Format</div><div>${esc(v.match.format)}, ${v.match.overs} overs</div><div>Toss</div><div>${esc(v.match.toss || '-')}</div><div>Officials</div><div>${esc(v.match.officials.join(', ') || '-')}</div></div></div>`;
}
const cm = (b) => `<div class="cm ${b.w ? 'w' : b.sym === '4' ? 'f4' : b.sym === '6' ? 'f6' : ''}"><span class="o">${esc(b.o)}</span>${ball(b.sym)}<span class="tx">${text(b)}</span></div>`;
function draw() {
  const v = vm, [st, live] = statusText(v);
  document.title = `${v.teams.A.short} vs ${v.teams.B.short}${v.score ? ' ' + v.score.runs + '/' + v.score.wkts : ''} | CREASE`;
  const row = (sd) => { const c = v.cards.find(x => x.side === sd), t = v.teams[sd], on = c && v.cards.indexOf(c) === v.innings - 1 && v.match.status === 'live'; return `<div class="r">${fl(t)}<div class="n ${c && !on && v.match.status !== 'complete' ? 'dim' : ''}">${esc(t.name)}</div>${c ? `<div class="v">${c.runs}-${c.wkts}<small>(${c.overs} Ov)</small></div>` : '<div class="v" style="color:var(--mut);font-size:14px">Yet to bat</div>'}</div>`; };
  const tabs = [['live', 'Live'], ['card', 'Scorecard'], ['comm', 'Commentary'], ['squad', 'Squads'], ['info', 'Info'], ...(v.points ? [['points', 'Points table']] : [])];
  document.getElementById('root').innerHTML = `<div class="crumb">Home &rsaquo; ${esc(v.match.tournament || 'Matches')} &rsaquo; ${esc(v.teams.A.short)} vs ${esc(v.teams.B.short)}</div>
   <div class="card"><div class="hd"><div class="t">${esc(v.teams.A.name)} vs ${esc(v.teams.B.name)}${v.match.number ? ', Match ' + esc(v.match.number) : ''}${v.match.tournament ? ', ' + esc(v.match.tournament) : ''}</div><div class="s">${esc(v.match.venue || '')}${v.match.date ? ' &middot; ' + esc(v.match.date.replace('T', ' ')) : ''}</div></div><div class="sc">${row('A')}${row('B')}</div><div class="st ${live ? 'live' : ''}">${live ? '<span class="dot"></span>' : ''}${esc(st)}</div></div>
   <div class="tabs">${tabs.map(([k, l]) => `<button data-t="${k}" class="${tab === k ? 'on' : ''}">${l}</button>`).join('')}</div><div style="margin-top:12px">${view()}</div>`;
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; draw(); });
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = (e) => { e.preventDefault(); tab = b.dataset.go; draw(); scrollTo(0, 0); });
  document.querySelectorAll('[data-tg]').forEach(b => b.onclick = () => { const i = +b.dataset.tg; open[i] = open[i] === false; draw(); });
}
let rtS = null;
async function load() { try { const r = await fetch(`/api/public/matches/${encodeURIComponent(id)}`, { cache: 'no-store' });
  if (r.status === 404) { document.getElementById('root').innerHTML = '<div class="card" style="margin-top:14px"><div class="empty"><b style="font-size:20px">Match not found</b><br>This match is private or does not exist.</div></div>'; return false; }
  const j = await r.json(); if (j.rt && !rtS) rtS = subscribe(j.rt, () => load()); if (String(j.v) !== ver) { ver = String(j.v); vm = j.vm; draw(); } } catch {} return true; }
if (await load()) setInterval(() => { if (!rtS || !rtS.connected() || Math.random() < 0.25) load(); }, 3000);
document.getElementById('qrb').onclick = () => { const p = document.getElementById('qrp'); p.hidden = !p.hidden; document.getElementById('qrimg').innerHTML = qrSvg(PUB, { margin: 1 }); document.getElementById('qrurl').textContent = PUB; };
document.getElementById('simg').onclick = () => { if (vm) openSummary(vm, PUB); };
document.getElementById('prn').onclick = () => { tab = 'card'; if (vm) draw(); setTimeout(() => window.print(), 80); };
document.getElementById('share').onclick = async () => { try { if (navigator.share) await navigator.share({ title: document.title, url: PUB }); else { await navigator.clipboard.writeText(PUB); alert('Link copied'); } } catch {} };
</script></body></html>
