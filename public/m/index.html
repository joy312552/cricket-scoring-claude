<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c100e">
<title>Live cricket scoreboard</title><meta name="description" content="Ball-by-ball live cricket scorecard.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=DM+Mono:wght@400;500&family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
<style>
.hd{background:linear-gradient(135deg,#143b25,#0c100e);border-bottom:1px solid var(--line);padding:22px 0}.hd .tn{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}@media(max-width:600px){.inn{grid-template-columns:1fr}}
.is{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#0006;border:1px solid var(--line);min-height:88px}.is.cur{border-color:var(--lime)}.is b.sc{font:900 54px/1 var(--f-d)}.is small{display:block;font:500 12px var(--f-m);color:var(--dim)}.is .nm{font:800 26px var(--f-d);letter-spacing:.06em}
.crestimg{width:44px;height:44px;object-fit:cover;display:inline-grid;place-items:center;font:800 14px var(--f-d);clip-path:polygon(50% 0,100% 12%,100% 64%,50% 100%,0 64%,0 12%)}
.status{margin-top:14px;font:600 18px var(--f-b);color:var(--lime)}
.tb{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:24px 0 16px;overflow:auto}.tb button{background:none;border:0;padding:12px 18px;font:800 20px var(--f-d);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}.tb button.on{color:var(--lime);border-bottom-color:var(--lime)}
.bat td.o{color:var(--dim);font-size:13px}.over{display:flex;gap:6px;flex-wrap:wrap}.num{font-variant-numeric:tabular-nums}
.min{min-height:420px}
@media print{body{background:#fff!important;color:#000!important}.nav,.tb,#qrp,.btn,.hd .tn .tag{display:none!important}.hd{background:#fff!important;border-bottom:2px solid #000}.panel{background:#fff!important;border:1px solid #888!important;color:#000!important;break-inside:avoid}.panel:before,.panel:after{display:none}.t td,.t th{color:#000!important;border-color:#bbb!important}.is{background:#fff!important;border:1px solid #888!important;color:#000}.status{color:#000!important}.mono,small{color:#333!important}}
</style></head><body>
<header class="nav"><div class="wrap"><a class="logo" href="/"><svg viewBox="0 0 32 32"><g stroke="#d3ff3a" stroke-width="3" stroke-linecap="square"><path d="M8 6v22M16 6v22M24 6v22"/></g><path d="M5 7h22" stroke="#f1eee3" stroke-width="3"/></svg>CREASE</a><nav><button class="btn sm ghost" id="qrb">QR</button><button class="btn sm ghost" id="prn">Print</button><button class="btn sm ghost" id="share">Share</button></nav></div></header>
<div id="qrp" class="wrap" hidden style="padding-top:18px"><div class="panel" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><div id="qrimg" style="width:180px;height:180px;background:#fff"></div><div><h3>Scan to follow live</h3><p class="mono" id="qrurl"></p></div></div></div>
<div id="root"><div class="hd"><div class="wrap"><div class="skel line" style="width:40%"></div><div class="inn"><div class="skel blk" style="height:88px"></div><div class="skel blk" style="height:88px"></div></div></div></div><div class="wrap min"><div class="skel blk" style="margin-top:24px;height:260px"></div></div></div>
<script type="module">
import { ballChip, esc } from '/js/core.js'; import { qrSvg } from '/js/qr.js';
const id = location.pathname.split('/').filter(Boolean)[1]; let tab = new URLSearchParams(location.search).get('print') ? 'card' : 'live', vm = null, ver = '';
const crest = (t) => t.logo ? `<img class="crestimg" src="${esc(t.logo)}" alt="">` : `<span class="crestimg" style="background:${esc(t.color)};color:${esc(t.color2)}">${esc(t.short.slice(0, 3))}</span>`;
function status(v) { if (v.result) return v.result.text; const s = v.score; if (!s) return v.match.toss || 'Match not started'; if (s.target != null) return `${v.teams[v.bat].name} need ${s.need} from ${s.ballsLeft} balls`; return v.match.toss || ''; }
const bat = (c) => `<div class="panel scroll bat" style="margin-bottom:16px"><h3>${esc(c.teamName)} <span class="num">${c.runs}/${c.wkts}</span> <span class="mono">${c.overs} ov</span></h3><table class="t"><thead><tr><th>Batter</th><th></th><th class="r">R</th><th class="r">B</th><th class="r">4s</th><th class="r">6s</th><th class="r">SR</th></tr></thead><tbody>${c.bat.map(b => `<tr><td><b>${esc(b.name)}</b></td><td class="o">${esc(b.out)}</td><td class="r num"><b>${b.runs}</b></td><td class="r num">${b.balls}</td><td class="r num">${b.fours}</td><td class="r num">${b.sixes}</td><td class="r num">${b.sr}</td></tr>`).join('')}</tbody></table><p class="mono" style="margin:10px 0 0">Extras ${esc(c.extras.text)}${c.yetToBat.length ? ' &middot; Yet to bat: ' + esc(c.yetToBat.join(', ')) : ''}</p></div>
<div class="panel scroll" style="margin-bottom:16px"><h3>${esc(c.bowlTeam)} bowling</h3><table class="t"><thead><tr><th>Bowler</th><th class="r">O</th><th class="r">M</th><th class="r">R</th><th class="r">W</th><th class="r">Eco</th></tr></thead><tbody>${c.bowl.map(b => `<tr><td><b>${esc(b.name)}</b></td><td class="r num">${b.o}</td><td class="r num">${b.m}</td><td class="r num">${b.r}</td><td class="r num"><b>${b.w}</b></td><td class="r num">${b.econ}</td></tr>`).join('')}</tbody></table></div>`;
function draw() {
  const v = vm, s = v.score;
  document.title = `${v.teams.A.short} vs ${v.teams.B.short}: ${s ? s.runs + '/' + s.wkts : 'Live'} | CREASE`;
  const cards = v.cards, cur = v.innings - 1;
  const body = { live: () => !s ? `<div class="panel">The match has not started yet.</div>` : `<div class="grid g2"><div class="panel"><h3>At the crease</h3><table class="t"><tbody>${v.batters.map(b => `<tr><td><b>${esc(b.name)}${b.strike ? ' *' : ''}</b></td><td class="r num"><b>${b.runs}</b> (${b.balls})</td><td class="r num mono">SR ${b.sr}</td></tr>`).join('') || '<tr><td>-</td></tr>'}</tbody></table>
      <h3 style="margin-top:18px">Bowler</h3>${v.bowler ? `<table class="t"><tbody><tr><td><b>${esc(v.bowler.name)}</b></td><td class="r num">${v.bowler.o}-${v.bowler.m}-${v.bowler.r}-${v.bowler.w}</td><td class="r mono">eco ${v.bowler.econ}</td></tr></tbody></table>` : '-'}</div>
      <div class="panel"><h3>This over</h3><div class="over">${(v.thisOver.length ? v.thisOver : ['-']).map(ballChip).join('')}</div><h3 style="margin-top:18px">Match</h3><div class="grid g2" style="gap:6px"><span class="mono">Run rate</span><b class="num">${s.crr}</b>${s.target != null ? `<span class="mono">Target</span><b class="num">${s.target}</b><span class="mono">Required rate</span><b class="num">${s.rrr ?? '-'}</b>` : ''}<span class="mono">Partnership</span><b class="num">${v.partnership.runs} (${v.partnership.balls})</b></div></div></div>`,
    card: () => cards.map(bat).join('') || '<div class="panel">No scorecard yet.</div>',
    fow: () => cards.map(c => `<div class="panel" style="margin-bottom:16px"><h3>${esc(c.teamName)}: fall of wickets</h3>${c.fow.length ? `<table class="t"><tbody>${c.fow.map(f => `<tr><td class="num">${f.w}-${f.runs}</td><td><b>${esc(f.name)}</b></td><td class="r mono">${f.at} ov</td></tr>`).join('')}</tbody></table>` : '<span class="mono">No wickets</span>'}</div>`).join(''),
    info: () => `<div class="panel"><h3>${esc(v.match.name)}</h3><div class="kv" style="grid-template-columns:140px 1fr;display:grid;gap:8px"><span class="mono">Tournament</span><b>${esc(v.match.tournament || '-')}</b><span class="mono">Venue</span><b>${esc(v.match.venue || '-')}</b><span class="mono">Format</span><b>${esc(v.match.format)}, ${v.match.overs} overs</b><span class="mono">Toss</span><b>${esc(v.match.toss || '-')}</b><span class="mono">Officials</span><b>${esc(v.match.officials.join(', ') || '-')}</b></div></div>${v.points ? `<div class="panel scroll" style="margin-top:16px"><h3>Points table</h3><table class="t"><thead><tr><th>Team</th><th class="r">P</th><th class="r">W</th><th class="r">L</th><th class="r">NRR</th><th class="r">Pts</th></tr></thead><tbody>${v.points.map(r => `<tr><td><b>${esc(r.team)}</b></td><td class="r">${r.p}</td><td class="r">${r.w}</td><td class="r">${r.l}</td><td class="r">${r.nrr.toFixed(3)}</td><td class="r"><b>${r.pts}</b></td></tr>`).join('')}</tbody></table></div>` : ''}` }[tab]();
  document.getElementById('root').innerHTML = `<div class="hd"><div class="wrap"><div class="tn"><span class="tag ${v.match.status === 'live' ? 'live' : ''}">${v.match.status === 'break' ? 'innings break' : esc(v.match.status)}</span><span class="mono">${esc(v.match.tournament)} ${v.match.number ? '&middot; Match ' + esc(v.match.number) : ''}</span></div>
   <div class="inn">${['A', 'B'].map(sd => { const c = cards.find(x => x.side === sd), t = v.teams[sd]; return `<div class="is ${c && cards.indexOf(c) === cur && v.match.status !== 'complete' ? 'cur' : ''}">${crest(t)}<div style="flex:1"><div class="nm">${esc(t.name)}</div>${c ? `<small>${c.overs} / ${v.match.overs} ov</small>` : '<small>Yet to bat</small>'}</div>${c ? `<b class="sc num">${c.runs}<small style="display:inline;font-size:.5em;color:var(--dim)">/${c.wkts}</small></b>` : ''}</div>`; }).join('')}</div>
   <div class="status">${esc(status(v))}</div></div></div>
   <div class="wrap min"><div class="tb">${[['live', 'Live'], ['card', 'Scorecard'], ['fow', 'Wickets'], ['info', 'Info']].map(([k, l]) => `<button data-t="${k}" class="${tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>${body}</div>`;
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; draw(); });
}
async function load() { try { const r = await fetch(`/api/public/matches/${encodeURIComponent(id)}`, { cache: 'no-store' }); if (r.status === 404) { document.getElementById('root').innerHTML = '<div class="wrap" style="padding:80px 24px"><h1 style="font-size:64px">Match not found</h1><p style="color:var(--dim)">This match is private or does not exist.</p></div>'; return false; }
  const j = await r.json(); if (String(j.v) !== ver) { ver = String(j.v); vm = j.vm; draw(); } } catch {} return true; }
if (await load()) setInterval(load, 3000);
document.getElementById('qrb').onclick = () => { const p = document.getElementById('qrp'); p.hidden = !p.hidden; document.getElementById('qrimg').innerHTML = qrSvg(location.href.split('?')[0], { margin: 1 }); document.getElementById('qrurl').textContent = location.href.split('?')[0]; };
document.getElementById('prn').onclick = () => { tab = 'card'; if (vm) draw(); setTimeout(() => window.print(), 80); };
document.getElementById('share').onclick = async () => { const u = location.href; try { if (navigator.share) await navigator.share({ title: document.title, url: u }); else { await navigator.clipboard.writeText(u); alert('Link copied'); } } catch {} };
</script></body></html>
