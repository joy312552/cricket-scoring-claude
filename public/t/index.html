<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c100e"><title>Tournament | CREASE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=DM+Mono:wght@400;500&family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/site.css">
<style>.hd{background:linear-gradient(135deg,#143b25,#0c100e);border-bottom:1px solid var(--line);padding:34px 0}.hd h1{font-size:clamp(44px,8vw,96px)}.mc{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--turf2);align-items:center}.mc.live{border-left-color:var(--red)}.num{font-variant-numeric:tabular-nums}</style></head><body>
<header class="nav"><div class="wrap"><a class="logo" href="/"><svg viewBox="0 0 32 32"><g stroke="#d3ff3a" stroke-width="3" stroke-linecap="square"><path d="M8 6v22M16 6v22M24 6v22"/></g><path d="M5 7h22" stroke="#f1eee3" stroke-width="3"/></svg>CREASE</a></div></header>
<div id="root"><div class="hd"><div class="wrap"><div class="skel line" style="width:50%;height:60px"></div></div></div><div class="wrap" style="padding-top:24px"><div class="skel blk"></div></div></div>
<script type="module">
import { esc } from '/js/core.js'; const id = location.pathname.split('/').filter(Boolean)[1];
const r = await fetch(`/api/public/tournaments/${encodeURIComponent(id)}`).catch(() => null);
if (!r || !r.ok) document.getElementById('root').innerHTML = '<div class="wrap" style="padding:80px 24px"><h1 style="font-size:64px">Tournament not found</h1></div>';
else { const j = await r.json(), t = j.tournament; document.title = `${t.name} | CREASE`;
  document.getElementById('root').innerHTML = `<div class="hd"><div class="wrap"><span class="mono">${esc(t.organizer || '')} ${t.venue ? '&middot; ' + esc(t.venue) : ''}</span><h1>${esc(t.name)}</h1><p style="color:var(--dim);max-width:680px">${esc(t.desc || '')}</p></div></div>
  <div class="wrap" style="padding-top:28px;padding-bottom:60px"><div class="panel scroll"><h3>Points table</h3><table class="t"><thead><tr><th>#</th><th>Team</th><th class="r">P</th><th class="r">W</th><th class="r">L</th><th class="r">T</th><th class="r">NRR</th><th class="r">Pts</th></tr></thead><tbody>${j.table.map((x, i) => `<tr><td>${i + 1}</td><td><b>${esc(x.name)}</b></td><td class="r num">${x.p}</td><td class="r num">${x.w}</td><td class="r num">${x.l}</td><td class="r num">${x.t}</td><td class="r num">${x.nrr > 0 ? '+' : ''}${x.nrr.toFixed(3)}</td><td class="r num"><b>${x.pts}</b></td></tr>`).join('')}</tbody></table></div>
  <h2 style="font-size:40px;margin:32px 0 12px">Fixtures &amp; results</h2><div class="grid">${j.matches.map(m => `<a class="mc ${m.status === 'live' ? 'live' : ''}" href="/m/${esc(m.id)}"><div><b style="font:800 24px var(--f-d)">${esc(m.a)} vs ${esc(m.b)}</b><div class="mono">${esc(m.result || m.score.join(' | ') || m.date)}</div></div><span class="tag ${m.status === 'live' ? 'live' : m.status === 'complete' ? 'ok' : ''}">${esc(m.status)}</span></a>`).join('') || '<div class="panel">No public matches yet.</div>'}</div></div>`; }
</script></body></html>
